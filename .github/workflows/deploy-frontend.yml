# Build the Vite + React 19 frontend and sync to the production S3 bucket
# behind CloudFront. Runs only on push to main, only after CI has passed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID           — IAM user with S3 PutObject + CloudFront CreateInvalidation
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                  — eu-central-1
#   S3_BUCKET                   — bucket holding the SPA (e.g. vacancies-frontend-prod)
#   CLOUDFRONT_DISTRIBUTION_ID  — distribution ID for cache invalidation
#
# Optional repository variables:
#   VITE_API_URL                — public API base URL (defaults to /api if unset)
#   VITE_SENTRY_DSN             — Sentry browser DSN; when unset Sentry stays disabled
name: Deploy Frontend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Build + sync to S3 + invalidate CloudFront
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL:    ${{ vars.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_RELEASE:    ${{ github.sha }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Two-step sync: assets (hashed file names) get long cache TTL; index.html
      # gets no-cache so a deploy is immediately visible without waiting on
      # browser TTL expiry.
      - name: Sync hashed assets to S3 (long cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"
